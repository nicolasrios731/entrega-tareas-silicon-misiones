<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas — TP Clase 13 (DOM)</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F1F2F2;
      color: #20203A;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(43, 41, 109, 0.12);
      padding: 26px;
    }

    h1 {
      color: #2B296D;
      font-size: 22px;
      margin: 0 0 4px;
    }

    .sub {
      color: #6E6E80;
      font-size: 13px;
      margin: 0 0 20px;
    }

    .fila {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #nuevaTarea {
      flex: 1;
      padding: 11px 12px;
      border: 1.5px solid #CFD0DA;
      border-radius: 8px;
      font-size: 15px;
    }

    #nuevaTarea:focus {
      outline: none;
      border-color: #0E6689;
    }

    #agregar {
      background: #0E6689;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #agregar:hover {
      background: #0b4f68;
    }

    #lista {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #lista li {
      background: #F7F7FA;
      border: 1px solid #E7E7EE;
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 8px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #lista li.hecha {
      text-decoration: line-through;
      color: #9A9AAB;
      background: #EFEFF3;
    }

    .eliminar {
      border: none;
      background: transparent;
      color: #b04444;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 6px;
    }

    .eliminar:hover {
      color: #7d2525;
    }

    #contador {
      color: #2B296D;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Mi Lista de Tareas</h1>

    <p class="sub">
      TP Clase 13 · El DOM
    </p>

    <div class="fila">
      <input
        id="nuevaTarea"
        type="text"
        placeholder="Escribí una tarea..."
      />

      <button id="agregar">
        Agregar
      </button>
    </div>

    <ul id="lista"></ul>

    <p id="contador">
      Tareas pendientes: 0
    </p>

  </div>

  <script>

    // Seleccionamos los elementos que vamos a utilizar
    let input = document.querySelector("#nuevaTarea");
    let boton = document.querySelector("#agregar");
    let lista = document.querySelector("#lista");
    let contador = document.querySelector("#contador");


    // Actualiza la cantidad de tareas pendientes
    function actualizarContador() {

      let pendientes = 0;

      for (let i = 0; i < lista.children.length; i++) {

        if (!lista.children[i].classList.contains("hecha")) {
          pendientes++;
        }

      }

      contador.textContent = "Tareas pendientes: " + pendientes;
    }


    // Agregar una nueva tarea
    function agregarTarea() {

      let texto = input.value.trim();

      // No permite agregar tareas vacías
      if (texto === "") {
        return;
      }


      // Creamos el elemento li
      let li = document.createElement("li");


      // Creamos el texto de la tarea
      let textoTarea = document.createElement("span");
      textoTarea.textContent = texto;


      // Creamos el botón para eliminar
      let botonEliminar = document.createElement("button");
      botonEliminar.textContent = "Eliminar";
      botonEliminar.classList.add("eliminar");


      // Agregamos el texto y el botón dentro del li
      li.appendChild(textoTarea);
      li.appendChild(botonEliminar);


      // Cuando hacemos click en la tarea se marca como hecha
      li.addEventListener("click", function () {

        li.classList.toggle("hecha");

        actualizarContador();

      });


      // Evitamos que el click del botón también marque la tarea
      botonEliminar.addEventListener("click", function (evento) {

        evento.stopPropagation();

        li.remove();

        actualizarContador();

      });


      // Agregamos la tarea a la lista
      lista.appendChild(li);


      // Limpiamos el campo de texto
      input.value = "";

      // Volvemos a actualizar el contador
      actualizarContador();

      // Volvemos a dejar el cursor en el input
      input.focus();
    }


    // Click en el botón Agregar
    boton.addEventListener("click", function () {

      agregarTarea();

    });


    // Permite agregar una tarea presionando Enter
    input.addEventListener("keydown", function (evento) {

      if (evento.key === "Enter") {

        agregarTarea();

      }

    });


    // Contador inicial
    actualizarContador();

  </script>

</body>
</html>
