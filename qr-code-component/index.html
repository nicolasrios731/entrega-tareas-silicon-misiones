<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Component - Silicon Misiones</title>
  
  <!-- Fuente Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <article class="qr-card">
      <div class="qr-image-container">
        <img 
          src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://github.com/nicolasrios731" 
          alt="Código QR a mi perfil de GitHub"
          class="qr-image"
        >
      </div>
      <header class="qr-content">
        <h1 class="qr-title">Mejorá tus habilidades frontend construyendo proyectos reales</h1>
        <p class="qr-description">Escaneá el código QR para visitar mi perfil de GitHub y explorar mis trabajos y colaboraciones.</p>
      </header>
    </article>
  </main>

</body>
</html>
